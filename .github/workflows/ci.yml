# seam's own CI. The list here and the one in docs/contributing.md § Checks are compared by
# assertion A3 of seam's own checker — which is the point, with the limit stated: A3 compares
# check tokens from a closed vocabulary rather than command lines, so what it holds the two copies
# to is every command it can tokenise, and a command outside that vocabulary is invisible to it
# rather than reported as missing. `claude plugin validate` is inside it only because
# assertions.A3.extra_tokens in .seam/config.json names it.
#
# `node --test` is bare on purpose: it is the form docs/contributing.md § Checks documents, and
# node's own discovery finds tests/**/*.test.mjs while skipping tests/helpers.mjs. The form that
# fails on Node 24 is the directory positional, `node --test tests/`, which is not this.
name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A12 compares layer 3 against the default branch, which a depth-1 checkout of a pull
          # request or a feature branch does not have in either form (`master`, `origin/master`).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node scripts/check_docs.mjs
      # Pinned, because an unpinned fetch resolves whatever is newest and a validator that moves
      # under us is a check that can fail for a reason that is not drift. Installed as its own
      # step so the check itself reads `claude plugin validate`, which is the token A3 compares;
      # `npx pkg@version plugin validate` would match a different string on this side.
      - run: npm install -g @anthropic-ai/claude-code@2.1.316
      - run: claude plugin validate --strict .
